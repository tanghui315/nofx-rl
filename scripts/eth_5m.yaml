data:
  data_path: ./data/BTCUSDT_1h_20251018_220012.csv
  lookback_window: 512
  predict_window: 48
  max_context: 512
  clip: 5.0
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0

training:
  tokenizer_epochs: 30
  basemodel_epochs: 20
  batch_size: 32
  log_interval: 50
  num_workers: 4
  seed: 42
  tokenizer_learning_rate: 2e-4
  predictor_learning_rate: 1e-6
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 8

model_paths:
  pretrained_tokenizer: Kronos/pretrained/Kronos-Tokenizer-base
  pretrained_predictor: Kronos/pretrained/Kronos-base
  exp_name: ETHUSDT_5m_myexp
  base_path: ./finetuned
  base_save_path: ""         # 留空自动生成
  finetuned_tokenizer: ""    # 留空自动生成
  tokenizer_save_name: tokenizer
  basemodel_save_name: basemodel

experiment:
  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 0